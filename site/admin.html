  <title>SAT Admin — Students and Corrections</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-shell{max-width:1050px;margin:40px auto;padding:0 20px 60px}
    .admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
    .admin-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .admin-field input{padding:11px;border:1px solid #cfd4dc;border-radius:8px;font:inherit}
    .admin-status{min-height:24px;margin:14px 0}.admin-status.success{color:#08783f}.admin-status.error,.error-text{color:#b42318}
    .admin-student{margin-top:16px}.admin-actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
    .muted{color:#6b6f76}.student-progress{border-top:1px solid #e5e7eb;margin-top:14px;padding-top:14px}
    .admin-summary{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:14px}.admin-summary span{background:#f3f4f6;border-radius:8px;padding:8px 12px}
    .locked-row{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1px solid #e5e7eb;border-radius:9px;padding:12px;margin:9px 0}
    .locked-row div{display:flex;flex-direction:column;gap:3px}.locked-row span{font-size:.88rem;color:#6b6f76}
    code{word-break:break-all}
  </style>
<style id="sat-math-charcoal-gold-v1">
  :root {
    color-scheme: dark;
    --cg-bg: #111214;
    --cg-surface: #1d2025;
    --cg-surface-2: #24272d;
    --cg-surface-3: #2a2d33;
    --cg-border: #43464d;
    --cg-border-soft: #34373d;
    --cg-text: #f4f1e8;
    --cg-muted: #c0bbb0;
    --cg-gold: #d6ae4e;
    --cg-gold-light: #e7c96f;
    --cg-gold-dark: #9f7620;
    --cg-danger: #ef4444;
    --cg-success: #22c55e;
  }

  html,
  body {
    background: var(--cg-bg) !important;
    color: var(--cg-text) !important;
  }

  body {
    min-height: 100vh;
  }

  main,
  section,
  article,
  .page,
  .container,
  .wrapper,
  .wrap {
    color: var(--cg-text) !important;
  }

  /* Common SAT subject navigation */
  #sat-global-navigation,
  #sat-global-subject-nav,
  #sat-subject-navigation,
  .subject-nav {
    background: linear-gradient(135deg, #1c1d20 0%, #24262a 100%) !important;
    border-bottom: 1px solid #46484d !important;
    box-shadow: 0 5px 18px rgba(0, 0, 0, .26) !important;
  }

  #sat-global-navigation > span,
  #sat-global-subject-nav > span,
  #sat-subject-navigation > span,
  .subject-nav > span {
    color: #f2eee2 !important;
  }

  #sat-global-navigation a,
  #sat-global-subject-nav a,
  #sat-subject-navigation a,
  .subject-nav a {
    background: #24262a !important;
    border-color: #55585e !important;
    color: #ece7dc !important;
    box-shadow: none !important;
  }

  #sat-global-navigation a:hover,
  #sat-global-subject-nav a:hover,
  #sat-subject-navigation a:hover,
  .subject-nav a:hover {
    background: #303238 !important;
    border-color: #777a80 !important;
  }

  #sat-global-navigation a[aria-current="page"],
  #sat-global-subject-nav a[aria-current="page"],
  #sat-subject-navigation a[aria-current="page"],
  .subject-nav a[aria-current="page"] {
    background: linear-gradient(135deg, #e4c15f, #c69a30) !important;
    border-color: #e7c96f !important;
    color: #18191b !important;
    box-shadow: 0 4px 12px rgba(214, 174, 78, .20) !important;
  }

  /* Math-specific header/navigation */
  .site-header,
  header.site-header,
  .nav,
  .navbar,
  .topbar {
    background: #17181b !important;
    border-color: #383a40 !important;
    color: var(--cg-text) !important;
  }

  .brand,
  .math-brand,
  .nav a,
  .nav-links a,
  .navbar a {
    color: #f2eee2 !important;
  }

  .brand-mark,
  .sigma {
    background: linear-gradient(135deg, #f0cf76, #b68a26) !important;
    color: #191a1c !important;
    box-shadow: 0 6px 18px rgba(214, 174, 78, .22) !important;
  }

  .nav-links a[aria-current="page"],
  .nav-links a.active,
  .nav a[aria-current="page"],
  .navbar a.active {
    background: linear-gradient(135deg, #e4c15f, #c69a30) !important;
    color: #18191b !important;
  }

  /* Hero */
  .hero {
    background:
      radial-gradient(
        circle at 80% 20%,
        rgba(214, 174, 78, .18),
        transparent 33%
      ),
      linear-gradient(
        145deg,
        #1a1c20 0%,
        #131416 58%,
        #101113 100%
      ) !important;
    border-bottom: 1px solid #34363b !important;
    color: #fffdf5 !important;
  }

  .hero::before,
  .hero::after {
    opacity: .12 !important;
  }

  .hero-inner {
    background: transparent !important;
    color: #fffdf5 !important;
  }

  .hero h1,
  .hero h2,
  .hero h3,
  .hero strong {
    color: #fffdf5 !important;
    text-shadow: none !important;
  }

  .hero p,
  .hero span,
  .hero .eyebrow {
    color: #c8c2b6 !important;
  }

  .eyebrow {
    color: var(--cg-gold-light) !important;
  }

  /* Cards and panels */
  .panel,
  .card,
  .hero-card,
  .volume-card,
  .overall-card,
  .lesson,
  .question,
  .stat,
  .controls,
  .quiz-banner,
  .set-card,
  .progress-card,
  .practice-card,
  .section-card,
  .content-card,
  .modal-content,
  .dialog,
  .box {
    background: linear-gradient(180deg, #1f2227 0%, #1a1c20 100%) !important;
    border-color: var(--cg-border) !important;
    color: var(--cg-text) !important;
    box-shadow: 0 18px 45px rgba(0, 0, 0, .30) !important;
  }

  .set-card.featured,
  .volume-card.featured,
  .question.featured {
    border-color: #8e7637 !important;
  }

  .set-number {
    color: var(--cg-gold-light) !important;
    opacity: .09 !important;
  }

  /* Text */
  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  strong,
  .title,
  .word,
  .question-title,
  .q-number {
    color: #fffdf5 !important;
  }

  p,
  li,
  label,
  small,
  .muted,
  .subtitle,
  .description,
  .footer,
  footer,
  .meta,
  .helper,
  .hint,
  .explanation {
    color: var(--cg-muted) !important;
  }

  a {
    color: #e7c96f;
  }

  a:hover {
    color: #f4dda0;
  }

  /* Buttons */
  button,
  .btn,
  .choice,
  .topic-nav button,
  .card-button,
  .primary-button {
    background: #2b2e34 !important;
    color: #f5f0e4 !important;
    border-color: #55585e !important;
  }

  button:hover,
  .btn:hover,
  .choice:hover,
  .topic-nav button:hover,
  .card-button:hover,
  .primary-button:hover {
    background: #35383f !important;
    border-color: #777a80 !important;
  }

  .btn.primary,
  .primary-button,
  .card-button,
  #start-quiz,
  .actions-row .btn:first-child {
    background: linear-gradient(135deg, #e4c15f, #c69a30) !important;
    border-color: #e7c96f !important;
    color: #18191b !important;
    box-shadow: 0 8px 24px rgba(214, 174, 78, .22) !important;
  }

  .btn.primary:hover,
  .primary-button:hover,
  .card-button:hover,
  #start-quiz:hover {
    background: linear-gradient(135deg, #edcf79, #d5aa3f) !important;
  }

  .btn.secondary,
  .btn.ghost {
    background: #282b31 !important;
    color: #eee9dd !important;
  }

  .btn.danger,
  button.danger {
    background: #641b1b !important;
    border-color: #9f2929 !important;
    color: #fee2e2 !important;
  }

  /* Inputs and filters */
  input,
  select,
  textarea,
  .control,
  .numeric-answer {
    background: #121316 !important;
    color: var(--cg-text) !important;
    border-color: #505258 !important;
  }

  input::placeholder,
  textarea::placeholder {
    color: #858178 !important;
  }

  /* Active/selected states */
  .choice.selected,
  .topic-nav button.active,
  .filter.active,
  .tab.active {
    background: #6f571f !important;
    border-color: #d6ae4e !important;
    color: #fff8e4 !important;
  }

  .correct,
  .question.correct,
  .choice.correct-choice {
    background: #123322 !important;
    border-color: var(--cg-success) !important;
  }

  .incorrect,
  .question.incorrect,
  .choice.incorrect-choice,
  .choice.wrong-choice {
    background: #3b1414 !important;
    border-color: var(--cg-danger) !important;
  }

  /* Progress */
  .progress-track,
  .bar,
  progress {
    background: #0c0d0f !important;
  }

  .progress-track span,
  .bar > span,
  .progress-fill,
  progress::-webkit-progress-value {
    background: linear-gradient(90deg, #e7c96f, #c99d35) !important;
  }

  /* Chips/tags/formulas */
  .chips span,
  .tag,
  .badge,
  .pill,
  .formula {
    background: #282b31 !important;
    color: #e8d59c !important;
    border-color: #4f5156 !important;
  }

  .warning {
    background: #3a2d13 !important;
    border-color: #8a6a21 !important;
    color: #f3dfa2 !important;
  }

  code,
  pre {
    background: #0d0e10 !important;
    color: #f0d98f !important;
    border-color: #3f4146 !important;
  }

  /* Tables */
  table,
  th,
  td {
    background: var(--cg-surface) !important;
    color: var(--cg-text) !important;
    border-color: var(--cg-border) !important;
  }

  /* Footer */
  .footer,
  footer {
    background: #18191c !important;
    color: #918c82 !important;
    border-color: #31343a !important;
  }

  hr {
    border-color: #37393f !important;
  }

  @media print {
    html,
    body,
    main,
    section,
    article,
    .panel,
    .card,
    .question {
      background: #ffffff !important;
      color: #000000 !important;
      box-shadow: none !important;
    }
  }
</style>

<style id="sat-admin-template2-styles">
  .admin-shell{
    max-width:1380px;
  }

  .admin-student{
    margin-top:18px;
    padding:24px;
  }

  .admin-student-header{
    display:flex;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
  }

  .admin-student-identity{
    margin-right:auto;
  }

  .admin-student-identity h3{
    margin-bottom:6px;
  }

  .view-progress{
    display:inline-flex;
    align-items:center;
    gap:8px;
  }

  .view-progress-chevron{
    display:inline-block;
    transition:transform .18s ease;
  }

  .view-progress[aria-expanded="true"]
  .view-progress-chevron{
    transform:rotate(180deg);
  }

  .student-progress{
    border-top:1px solid #4a4d53;
    margin-top:20px;
    padding-top:20px;
  }

  .admin-summary{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:14px;
    margin-bottom:24px;
  }

  .admin-summary span{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:17px;
    border-radius:14px;
    background:#f3f4f6;
    color:#202329;
  }

  .admin-summary strong{
    font-size:1.65rem;
  }

  .admin-progress-heading{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:16px;
  }

  .admin-progress-heading h4{
    margin-bottom:5px;
    font-size:1.3rem;
  }

  .admin-progress-tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }

  .admin-progress-tab{
    min-height:43px;
    padding:0 18px;
    border:1px solid #4a4d53;

  .admin-progress-tab.active{
    border-color:#e3b83e;

    color:#17191d;
  }

  .admin-volume-grid{
    display:grid;
    grid-template-columns:
      repeat(3,minmax(0,1fr));
    gap:17px;
  }

  .admin-volume-card{
    display:flex;
    flex-direction:column;
    min-width:0;
    padding:19px;
    border:1px solid #4a4d53;
    border-radius:17px;
    background:rgba(255,255,255,.025);

  .admin-volume-header{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:15px;
  }

  .admin-volume-header > div{
    margin-right:auto;
    min-width:0;

  .admin-volume-header h5{
    margin:5px 0;
    font-size:1.15rem;
  }

  .admin-volume-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:31px;
    height:31px;
    padding:0 9px;
    border-radius:999px;
    background:rgba(227,184,62,.16);
    color:#f1ce66;
    font-weight:900;
  }

  .admin-volume-actions{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:15px;

  .admin-volume-actions .btn{
    min-height:38px;
    padding:0 12px;
    font-size:.88rem;
  }

    display:grid;
    gap:10px;

  .admin-question-card{

  .admin-question-details{
    display:flex;
    flex-direction:column;
    gap:3px;
  }

  .admin-question-details span{
    color:#9da1aa;

  }

  .admin-question-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:11px;
  }

  .admin-question-actions .btn{
    min-height:37px;
    padding:0 12px;
    font-size:.86rem;
  }

  .admin-volume-empty{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:150px;
    padding:18px;
    border:1px dashed #4a4d53;
    border-radius:13px;
    color:#8d9199;
    text-align:center;
  }

  .admin-other-questions{
    margin-top:18px;
  }

  @media(max-width:1080px){

      grid-template-columns:

    }

    .admin-question-actions .btn{
      width:100%;
    }
  }
</style>

<script>
(function () {
  var student = (
    new URLSearchParams(window.location.search).get('student') || ''
  ).trim().toLowerCase();

  var currentPath = window.location.pathname.replace(/\/+/g, '/');

  document
    .querySelectorAll('#sat-global-navigation [data-sat-destination]')
    .forEach(function (link) {
      var destination = link.getAttribute('data-sat-destination');
      var url = new URL(destination, window.location.origin);

      if (student) {
        url.searchParams.set('student', student);
      }

      link.href = url.href;

      var active =
        (destination === '/index.html' && currentPath === '/index.html') ||
        (
          destination === '/english/index.html' &&
          currentPath.indexOf('/english/') === 0
        ) ||
        (
          destination === '/math/index.html' &&
          currentPath.indexOf('/math/') === 0
        );

      if (active) {
        link.style.background = '#2563eb';
        link.style.borderColor = '#2563eb';
        link.style.color = '#ffffff';
        link.style.boxShadow = '0 4px 10px rgba(37,99,235,.20)';
        link.setAttribute('aria-current', 'page');
      }
    });
})();
</script>

<script id="sat-math-two-row-hierarchy-script-v1">
(function () {
  const SET_1_VOLUMES = [
    {
      label: 'Volume 1',
      href: 'volume-1-algebra-foundations.html',
      files: ['volume-1-algebra-foundations.html']
    },
    {
      label: 'Volume 2',
      href: 'volume-2-advanced-math.html',
      files: ['volume-2-advanced-math.html']
    },
    {
      label: 'Volume 3',
      href: 'volume-3-data-geometry-trigonometry.html',
      files: ['volume-3-data-geometry-trigonometry.html']
    }
  ];

  const SET_2_VOLUMES = [
    {
      label: 'Volume 1',
      href: 'set-2-volume-1-algebra.html',
      files: ['set-2-volume-1-algebra.html']
    },
    {
      label: 'Volume 2',
      href: 'set-2-volume-2-advanced-math.html',
      files: ['set-2-volume-2-advanced-math.html']
    },
    {
      label: 'Volume 3',
      href: 'set-2-volume-3-data-geometry-trigonometry.html',
      files: ['set-2-volume-3-data-geometry-trigonometry.html']
    }
  ];

  function currentFile() {
    const path = window.location.pathname;
    return path.split('/').pop() || 'index.html';
  }

  function studentId() {
    return new URLSearchParams(window.location.search).get('student') || '';
  }

  function hrefWithStudent(href) {
    const student = studentId();

    if (!student) {
      return href;
    }

    const url = new URL(href, window.location.href);
    url.searchParams.set('student', student);

    return `${url.pathname.split('/').pop()}${url.search}${url.hash}`;
  }

  function makeLink(label, href, className, current) {
    const anchor = document.createElement('a');
    anchor.textContent = label;
    anchor.href = hrefWithStudent(href);

    if (className) {
      anchor.className = className;
    }

    if (current) {
      anchor.setAttribute('aria-current', 'page');
    }

    return anchor;
  }

  function activeSet(file) {
    if (
      file === 'set-2.html' ||
      SET_2_VOLUMES.some(volume => volume.files.includes(file))
    ) {
      return 2;
    }

    if (
      file === 'set-1.html' ||
      SET_1_VOLUMES.some(volume => volume.files.includes(file))
    ) {
      return 1;
    }

    return 0;
  }

  function activeVolume(file, volumes) {
    return volumes.findIndex(volume => volume.files.includes(file));
  }

  function buildNavigation() {
    const navLinks =
      document.querySelector('.site-header .nav-links') ||
      document.querySelector('.nav-links');

    if (!navLinks) {
      console.warn('Two-row Math navigation skipped: .nav-links not found.');
      return;
    }

    const file = currentFile();
    const setNumber = activeSet(file);

    const topRow = document.createElement('div');
    topRow.className = 'sat-math-nav-top-row';

    topRow.append(
      makeLink(
        'Home',
        'index.html',
        '',
        file === 'index.html'
      ),
      makeLink(
        'Set 1',
        'set-1.html',
        setNumber === 1 ? 'sat-parent-selected' : '',
        file === 'set-1.html'
      ),
      makeLink(
        'Set 2',
        'set-2.html',
        setNumber === 2 ? 'sat-parent-selected' : '',
        file === 'set-2.html'
      )
    );

    const fragment = document.createDocumentFragment();
    fragment.appendChild(topRow);

    if (setNumber === 1 || setNumber === 2) {
      const volumeRow = document.createElement('div');
      volumeRow.className = 'sat-math-nav-volume-row';

      const label = document.createElement('span');
      label.className = 'sat-math-nav-label';
      label.textContent = `SET ${setNumber} VOLUMES`;

      volumeRow.appendChild(label);

      const volumes = setNumber === 1
        ? SET_1_VOLUMES
        : SET_2_VOLUMES;

      const selectedIndex = activeVolume(file, volumes);

      volumes.forEach((volume, index) => {
        volumeRow.appendChild(
          makeLink(
            volume.label,
            volume.href,
            index === selectedIndex ? 'sat-child-selected' : '',
            index === selectedIndex
          )
        );
      });

      fragment.appendChild(volumeRow);
    }

    navLinks.replaceChildren(fragment);
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      buildNavigation,
      { once: true }
    );
  } else {
    buildNavigation();
  }
})();
</script>

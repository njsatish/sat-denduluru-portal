<script id="sat-english-identity-v7">
/* BEGIN SAT ENGLISH IDENTITY V7 */
(() => {
  'use strict';

  if (window.SATEnglishIdentity?.build === '20260804-english-identity-v7-20260804T182532Z') return;

  const normalize = value => {
    const id = String(value || '').trim().toLowerCase();
    return /^[a-z0-9_-]{1,80}$/.test(id) ? id : '';
  };

  const decodeToken = token => {
    try {
      const part = String(token || '').split('.')[1];
      if (!part) return null;
      const base64 = part.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (error) {
      console.warn('Unable to decode the SAT Cognito identity.', error);
      return null;
    }
  };

  const nativeGet = URLSearchParams.prototype.get;
  const tokenClaims = decodeToken(
    sessionStorage.getItem('sat_id_token') ||
    localStorage.getItem('sat_id_token')
  );
  const tokenStudent = normalize(
    window.SATAuth?.studentId ||
    window.SATAuth?.username ||
    tokenClaims?.['cognito:username'] ||
    tokenClaims?.username ||
    tokenClaims?.preferred_username
  );
  const storedStudent = normalize(localStorage.getItem('sat_user'));
  const pageParams = new URLSearchParams(location.search);
  const urlStudent = normalize(nativeGet.call(pageParams, 'student'));
  let studentId = tokenStudent || storedStudent || urlStudent;

  function resolveStudentId() {
    const claims = decodeToken(
      sessionStorage.getItem('sat_id_token') ||
      localStorage.getItem('sat_id_token')
    );
    const authenticated = normalize(
      window.SATAuth?.studentId ||
      window.SATAuth?.username ||
      claims?.['cognito:username'] ||
      claims?.username ||
      claims?.preferred_username
    );
    const stored = normalize(localStorage.getItem('sat_user'));
    studentId = authenticated || stored || studentId || urlStudent;
    if (studentId) localStorage.setItem('sat_user', studentId);
    return studentId;
  }

  if (!URLSearchParams.prototype.__satEnglishIdentityV7) {
    URLSearchParams.prototype.get = function(name) {
      const value = nativeGet.call(this, name);
      if (String(name) === 'student' && !normalize(value)) {
        return resolveStudentId() || value;
      }
      return value;
    };
    Object.defineProperty(URLSearchParams.prototype, '__satEnglishIdentityV7', {
      value: true,
      configurable: true
    });
  }

  function cleanStudentParameter(urlValue) {
    try {
      const url = new URL(urlValue, location.href);
      if (url.origin !== location.origin) return urlValue;
      url.searchParams.delete('student');
      return `${url.pathname}${url.search}${url.hash}`;
    } catch (_) {
      return urlValue;
    }
  }

  function cleanAddressBar() {
    const url = new URL(location.href);
    if (!url.searchParams.has('student')) return;
    url.searchParams.delete('student');
    history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
  }

  function cleanStudentLinks(root = document) {
    root.querySelectorAll?.('a[href]').forEach(anchor => {
      const href = anchor.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
      const cleaned = cleanStudentParameter(href);
      if (cleaned !== href) anchor.setAttribute('href', cleaned);
    });
  }

  resolveStudentId();
  cleanAddressBar();

  window.SATResolveStudentId = resolveStudentId;
  window.SATEnglishIdentity = {
    build: '20260804-english-identity-v7-20260804T182532Z',
    get studentId() { return resolveStudentId(); },
    source: tokenStudent ? 'cognito' : storedStudent ? 'storage' : urlStudent ? 'url' : 'missing',
    normalize,
    resolveStudentId,
    cleanStudentLinks
  };

  const ready = () => {
    cleanStudentLinks();
    setTimeout(cleanStudentLinks, 0);
    setTimeout(cleanStudentLinks, 150);
    setTimeout(cleanStudentLinks, 600);

    if (document.body && window.MutationObserver) {
      const observer = new MutationObserver(records => {
        for (const record of records) {
          record.addedNodes.forEach(node => {
            if (node.nodeType === 1) cleanStudentLinks(node);
          });
        }
      });
      observer.observe(document.body, {childList: true, subtree: true});
      setTimeout(() => observer.disconnect(), 5000);
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ready, {once: true});
  } else {
    ready();
  }
})();
/* END SAT ENGLISH IDENTITY V7 */
</script>


<script id="sat-english-cognito-bootstrap">
(() => {
  'use strict';

  function normalizeStudentId(value) {
    const normalized =
      String(value || '').trim().toLowerCase();

    return /^[a-z0-9_-]{1,80}$/.test(normalized)
      ? normalized
      : '';
  }

  function decodeJwtPayload(token) {
    const parts = String(token || '').split('.');

    if (parts.length !== 3) {
      return null;
    }

    const base64 = parts[1]
      .replace(/-/g, '+')
      .replace(/_/g, '/');

    const padded =
      base64 + '='.repeat((4 - base64.length % 4) % 4);

    try {
      const binary = atob(padded);
      const bytes = Uint8Array.from(
        binary,
        character => character.charCodeAt(0)
      );

      return JSON.parse(
        new TextDecoder().decode(bytes)
      );
    } catch (error) {
      console.warn(
        'Unable to read the SAT Cognito ID token.',
        error
      );

      return null;
    }
  }

  const existing =
    normalizeStudentId(
      window.localStorage.getItem('sat_user')
    );

  if (existing) {
    return;
  }

  const claims =
    decodeJwtPayload(
      window.sessionStorage.getItem('sat_id_token')
    );

  const username =
    normalizeStudentId(
      claims?.['cognito:username'] ||
      claims?.username
    );

  if (username) {
    window.localStorage.setItem(
      'sat_user',
      username
    );
  }
})();
</script>

<script>

const SAT_PROGRESS_KEY = window.SATEnglishCloud.storageKey;

function getProgress() {
  try {
    const raw = localStorage.getItem(SAT_PROGRESS_KEY);
    const saved = raw ? JSON.parse(raw) : {};
    const cleaned = Array.isArray(saved.learned)
      ? saved.learned
          .map(Number)
          .filter((number) => Number.isInteger(number) && number >= 1 && number <= 300)
      : [];
    return { learned: [...new Set(cleaned)] };
  } catch (error) {
    return { learned: [] };
  }
}

function setProgress(progress) {
  const cleaned = [...new Set((progress.learned || [])
    .map(Number)
    .filter((number) => Number.isInteger(number) && number >= 1 && number <= 300))];
  try {
    localStorage.setItem(SAT_PROGRESS_KEY, JSON.stringify({ learned: cleaned }));
    window.SATEnglishCloud.queueLearnedSync(cleaned);
  } catch (error) {
    // The page remains usable if the browser does not allow localStorage.
  }
  return { learned: cleaned };
}

function learnedSet() {
  return new Set(getProgress().learned);
}

function isLearned(number) {
  return learnedSet().has(Number(number));
}

function markLearned(number, learned) {
  const progress = getProgress();
  const set = new Set(progress.learned);
  if (learned) {
    set.add(Number(number));
  } else {
    set.delete(Number(number));
  }
  return setProgress({ learned: [...set] });
}

function resetAllProgress() {
  return setProgress({ learned: [] });
}

function globalCounts() {
  const learned = learnedSet().size;
  return { learned, remaining: 300 - learned };
}

function rangeCounts(start, end) {
  const set = learnedSet();
  let learned = 0;
  for (let number = start; number <= end; number += 1) {
    if (set.has(number)) learned += 1;
  }
  return { learned, remaining: (end - start + 1) - learned, total: end - start + 1 };
}

function askToResetProgress() {
  return window.confirm("Reset all learned-word progress for all 300 SAT words on this browser?");
}

const WORDS = [{"number": 101, "word": "Abrupt", "meaning": "sudden and unexpected", "synonyms": "sudden, hasty, unexpected", "example": "The abrupt change in the weather canceled the outdoor concert."}, {"number": 102, "word": "Abstract", "meaning": "existing as an idea rather than as a physical thing", "synonyms": "theoretical, conceptual, intangible", "example": "Justice is an abstract idea that can be difficult to define."}, {"number": 103, "word": "Abysmal", "meaning": "extremely bad or very poor", "synonyms": "dreadful, terrible, deplorable", "example": "The team gave an abysmal performance in the first half."}, {"number": 104, "word": "Accommodate", "meaning": "to provide space for or adjust to meet a need", "synonyms": "adapt, assist, make room for", "example": "The school adjusted the schedule to accommodate students with after-school jobs."}, {"number": 105, "word": "Acknowledge", "meaning": "to recognize or admit that something is true", "synonyms": "admit, recognize, concede", "example": "The author acknowledged that the evidence was incomplete."}, {"number": 106, "word": "Adequate", "meaning": "enough for a particular purpose", "synonyms": "sufficient, acceptable, satisfactory", "example": "The explanation was adequate, but it did not answer every question."}, {"number": 107, "word": "Adhere", "meaning": "to follow closely or stick firmly to", "synonyms": "obey, comply, conform", "example": "Researchers must adhere to strict safety rules in the laboratory."}, {"number": 108, "word": "Advantageous", "meaning": "helpful or likely to produce a benefit", "synonyms": "beneficial, favorable, useful", "example": "Starting SAT preparation early can be advantageous."}, {"number": 109, "word": "Advent", "meaning": "the arrival or beginning of something important", "synonyms": "arrival, onset, emergence", "example": "The advent of the internet changed how people find information."}, {"number": 110, "word": "Aggravate", "meaning": "to make a problem, pain, or situation worse", "synonyms": "worsen, intensify, exacerbate", "example": "Ignoring the leak could aggravate the damage to the ceiling."}, {"number": 111, "word": "Allude", "meaning": "to refer indirectly to something", "synonyms": "hint, imply, suggest", "example": "The speaker alluded to a past disagreement without naming anyone."}, {"number": 112, "word": "Ambiguity", "meaning": "uncertainty caused by having more than one possible meaning", "synonyms": "vagueness, uncertainty, obscurity", "example": "The ambiguity of the question made two answers seem possible."}, {"number": 113, "word": "Amplify", "meaning": "to increase in strength, amount, or effect", "synonyms": "increase, intensify, magnify", "example": "The microphone amplified the speaker's voice for the large audience."}, {"number": 114, "word": "Annotate", "meaning": "to add notes or comments to a text", "synonyms": "comment, explain, mark up", "example": "Students annotated the article to identify the author's main claim."}, {"number": 115, "word": "Antecedent", "meaning": "an earlier event, condition, or word that comes before another", "synonyms": "forerunner, precursor, predecessor", "example": "The small protests were an antecedent to the larger movement."}, {"number": 116, "word": "Antipathy", "meaning": "a strong feeling of dislike", "synonyms": "hostility, aversion, resentment", "example": "Her antipathy toward dishonesty made her a careful fact-checker."}, {"number": 117, "word": "Apex", "meaning": "the highest point or greatest stage", "synonyms": "peak, summit, height", "example": "Winning the championship was the apex of the team's season."}, {"number": 118, "word": "Approximate", "meaning": "close to the exact amount or value, but not exact", "synonyms": "estimated, near, rough", "example": "The approximate cost of the trip was five hundred dollars."}, {"number": 119, "word": "Arcane", "meaning": "understood by only a few people because it is secret or specialized", "synonyms": "obscure, mysterious, esoteric", "example": "The professor explained the arcane scientific terms in simple language."}, {"number": 120, "word": "Austere", "meaning": "plain, severe, or without comfort or decoration", "synonyms": "severe, simple, stern", "example": "The room's austere design had bare walls and little furniture."}, {"number": 121, "word": "Benevolent", "meaning": "kind and willing to help others", "synonyms": "generous, charitable, compassionate", "example": "A benevolent donor paid for new books for the school library."}, {"number": 122, "word": "Buttress", "meaning": "to support or strengthen an idea or argument", "synonyms": "reinforce, support, strengthen", "example": "The new data helped buttress the scientist's conclusion."}, {"number": 123, "word": "Calibrate", "meaning": "to adjust something carefully for accuracy", "synonyms": "adjust, fine-tune, measure", "example": "The technician calibrated the scale before weighing the samples."}, {"number": 124, "word": "Catastrophic", "meaning": "causing enormous damage or suffering", "synonyms": "disastrous, devastating, ruinous", "example": "The storm caused catastrophic flooding across the region."}, {"number": 125, "word": "Characterization", "meaning": "the way an author presents a character's traits and personality", "synonyms": "portrayal, depiction, description", "example": "The novel's characterization reveals the hero's fears through her choices."}];
let remainingOnly = true;
let order = [];
let index = 0;
let revealed = false;
let hardCount = 0;
let gotCount = 0;

const $ = (id) => document.getElementById(id);
function shuffle(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function rebuildDeck() {
  const set = learnedSet();
  order = shuffle(WORDS.filter((word) => !remainingOnly || !set.has(word.number)).map((word) => word.number));
  index = 0;
  revealed = false;
}
function currentWord() {
  const currentNumber = order[index];
  return WORDS.find((word) => word.number === currentNumber);
}
function updateProgressPanel() {
  const global = globalCounts();
  $("globalLearned").textContent = `${global.learned} / 300 learned`;
  $("globalRemaining").textContent = `${global.remaining} remaining`;
  $("globalFill").style.width = `${(global.learned / 300) * 100}%`;
}
function render() {
  updateProgressPanel();
  if (index >= order.length || order.length === 0) {
    $("flashView").innerHTML = `<div class="card complete"><h1>${remainingOnly ? "No remaining words in this set" : "Flashcards complete"}</h1><p>${remainingOnly ? "All words in this 25-word set are marked learned." : "You reviewed this set."}</p><button class="btn primary" id="restart">Study remaining words</button> <button class="btn" id="studyAll">Study all 25 words</button></div>`;
    $("restart").onclick = () => { remainingOnly = true; $("remainingOnly").checked = true; rebuildDeck(); render(); };
    $("studyAll").onclick = () => { remainingOnly = false; $("remainingOnly").checked = false; rebuildDeck(); render(); };
    return;
  }
  const word = currentWord();
  $("count").textContent = `Card ${index + 1} of ${order.length}`;
  $("progress").style.width = `${((index + 1) / order.length) * 100}%`;
  $("word").textContent = word.word;
  $("meaning").textContent = word.meaning;
  $("synonyms").textContent = `Synonyms: ${word.synonyms}`;
  $("example").textContent = `“${word.example}”`;
  $("card").classList.toggle("revealed", revealed);
  $("prev").disabled = index === 0;
  $("current").textContent = index + 1;
  $("hardCount").textContent = hardCount;
  $("gotCount").textContent = gotCount;
}
function advance() {
  index += 1;
  revealed = false;
  render();
}
$("card").onclick = () => { revealed = !revealed; render(); };
$("card").onkeydown = (event) => {
  if (event.key === "Enter" || event.key === " ") { event.preventDefault(); revealed = !revealed; render(); }
};
$("prev").onclick = () => { if (index > 0) { index -= 1; revealed = false; render(); } };
$("next").onclick = advance;
$("hard").onclick = () => { hardCount += 1; advance(); };
$("got").onclick = () => {
  const word = currentWord();
  markLearned(word.number, true);
  gotCount += 1;
  if (remainingOnly) {
    order.splice(index, 1);
    revealed = false;
    render();
  } else {
    advance();
  }
};
$("shuffle").onclick = () => { rebuildDeck(); hardCount = 0; gotCount = 0; render(); };
$("remainingOnly").addEventListener("change", (event) => { remainingOnly = event.target.checked; rebuildDeck(); render(); });
$("resetProgress").addEventListener("click", () => {
  if (askToResetProgress()) { resetAllProgress(); rebuildDeck(); render(); }
});
window.addEventListener("storage", () => { if (remainingOnly) { rebuildDeck(); } render(); });
window.SATEnglishCloud.ready.then(() => { rebuildDeck(); render(); }).catch(() => {});
</script>

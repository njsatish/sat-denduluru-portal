<!DOCTYPE html>
<html lang="en"><head>
<script id="sat-english-identity-v7">
/* BEGIN SAT ENGLISH IDENTITY V7 */
(() => {
  'use strict';

  if (window.SATEnglishIdentity?.build === '20260804-english-identity-v7-20260804T182532Z') return;

  const normalize = value => {
    const id = String(value || '').trim().toLowerCase();
    return /^[a-z0-9_-]{1,80}$/.test(id) ? id : '';
  };

  const decodeToken = token => {
    try {
      const part = String(token || '').split('.')[1];
      if (!part) return null;
      const base64 = part.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (error) {
      console.warn('Unable to decode the SAT Cognito identity.', error);
      return null;
    }
  };

  const nativeGet = URLSearchParams.prototype.get;
  const tokenClaims = decodeToken(
    sessionStorage.getItem('sat_id_token') ||
    localStorage.getItem('sat_id_token')
  );
  const tokenStudent = normalize(
    window.SATAuth?.studentId ||
    window.SATAuth?.username ||
    tokenClaims?.['cognito:username'] ||
    tokenClaims?.username ||
    tokenClaims?.preferred_username
  );
  const storedStudent = normalize(localStorage.getItem('sat_user'));
  const pageParams = new URLSearchParams(location.search);
  const urlStudent = normalize(nativeGet.call(pageParams, 'student'));
  let studentId = tokenStudent || storedStudent || urlStudent;

  function resolveStudentId() {
    const claims = decodeToken(
      sessionStorage.getItem('sat_id_token') ||
      localStorage.getItem('sat_id_token')
    );
    const authenticated = normalize(
      window.SATAuth?.studentId ||
      window.SATAuth?.username ||
      claims?.['cognito:username'] ||
      claims?.username ||
      claims?.preferred_username
    );
    const stored = normalize(localStorage.getItem('sat_user'));
    studentId = authenticated || stored || studentId || urlStudent;
    if (studentId) localStorage.setItem('sat_user', studentId);
    return studentId;
  }

  if (!URLSearchParams.prototype.__satEnglishIdentityV7) {
    URLSearchParams.prototype.get = function(name) {
      const value = nativeGet.call(this, name);
      if (String(name) === 'student' && !normalize(value)) {
        return resolveStudentId() || value;
      }
      return value;
    };
    Object.defineProperty(URLSearchParams.prototype, '__satEnglishIdentityV7', {
      value: true,
      configurable: true
    });
  }

  function cleanStudentParameter(urlValue) {
    try {
      const url = new URL(urlValue, location.href);
      if (url.origin !== location.origin) return urlValue;
      url.searchParams.delete('student');
      return `${url.pathname}${url.search}${url.hash}`;
    } catch (_) {
      return urlValue;
    }
  }

  function cleanAddressBar() {
    const url = new URL(location.href);
    if (!url.searchParams.has('student')) return;
    url.searchParams.delete('student');
    history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
  }

  function cleanStudentLinks(root = document) {
    root.querySelectorAll?.('a[href]').forEach(anchor => {
      const href = anchor.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
      const cleaned = cleanStudentParameter(href);
      if (cleaned !== href) anchor.setAttribute('href', cleaned);
    });
  }

  resolveStudentId();
  cleanAddressBar();

  window.SATResolveStudentId = resolveStudentId;
  window.SATEnglishIdentity = {
    build: '20260804-english-identity-v7-20260804T182532Z',
    get studentId() { return resolveStudentId(); },
    source: tokenStudent ? 'cognito' : storedStudent ? 'storage' : urlStudent ? 'url' : 'missing',
    normalize,
    resolveStudentId,
    cleanStudentLinks
  };

  const ready = () => {
    cleanStudentLinks();
    setTimeout(cleanStudentLinks, 0);
    setTimeout(cleanStudentLinks, 150);
    setTimeout(cleanStudentLinks, 600);

    if (document.body && window.MutationObserver) {
      const observer = new MutationObserver(records => {
        for (const record of records) {
          record.addedNodes.forEach(node => {
            if (node.nodeType === 1) cleanStudentLinks(node);
          });
        }
      });
      observer.observe(document.body, {childList: true, subtree: true});
      setTimeout(() => observer.disconnect(), 5000);
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ready, {once: true});
  } else {
    ready();
  }
})();
/* END SAT ENGLISH IDENTITY V7 */
</script>


<script id="sat-english-cognito-bootstrap">
(() => {
  'use strict';

  function normalizeStudentId(value) {
    const normalized =
      String(value || '').trim().toLowerCase();

    return /^[a-z0-9_-]{1,80}$/.test(normalized)
      ? normalized
      : '';
  }

  function decodeJwtPayload(token) {
    const parts = String(token || '').split('.');

    if (parts.length !== 3) {
      return null;
    }

    const base64 = parts[1]
      .replace(/-/g, '+')
      .replace(/_/g, '/');

    const padded =
      base64 + '='.repeat((4 - base64.length % 4) % 4);

    try {
      const binary = atob(padded);
      const bytes = Uint8Array.from(
        binary,
        character => character.charCodeAt(0)
      );

      return JSON.parse(
        new TextDecoder().decode(bytes)
      );
    } catch (error) {
      console.warn(
        'Unable to read the SAT Cognito ID token.',
        error
      );

      return null;
    }
  }

  const existing =
    normalizeStudentId(
      window.localStorage.getItem('sat_user')
    );

  if (existing) {
    return;
  }

  const claims =
    decodeJwtPayload(
      window.sessionStorage.getItem('sat_id_token')
    );

  const username =
    normalizeStudentId(
      claims?.['cognito:username'] ||
      claims?.username
    );

  if (username) {
    window.localStorage.setItem(
      'sat_user',
      username
    );
  }
})();
</script>

</head><body><header class="sat-global-nav"><div class="sat-global-inner"><a class="sat-brand" href="../index.html">SAT Prep</a><nav aria-label="SAT subject navigation"><a href="../index.html">SAT Home</a><a aria-current="page" class="active" href="index.html">English</a><a href="../math/index.html">Math</a></nav><div class="sat-student">Student: <strong data-student-name="">Student</strong></div></div></header><main class="container"><section class="hero"><div class="eyebrow">Meaning recognition</div><h1>Vocabulary Quiz</h1><p id="rangeLabel"></p><div class="actions"><a class="btn secondary" href="SAT_Practice_Hub.html">Practice Hub</a><button class="btn" id="restartBtn">Restart Quiz</button></div></section><section class="card practice-panel"><div class="progress-row"><span class="count" id="questionCount"></span><span class="progress-number" id="scoreCount">Score: 0</span></div><h2 class="flash-word" id="quizWord"></h2><p>Choose the best meaning.</p><div id="choices"></div><div class="feedback" id="feedback"></div><button class="btn" hidden="" id="nextQuestion">Next Question</button></section></main><footer>Original SAT-style vocabulary practice · Progress is preserved in this browser.</footer><script src="vocabulary-data.js"></script><script>
const SAT_PROGRESS_KEY = window.SATEnglishStudent.storageKey;
const SAT_WORD_TOTAL = 375;
function getProgress(){try{const raw=localStorage.getItem(SAT_PROGRESS_KEY);const saved=raw?JSON.parse(raw):{};const cleaned=Array.isArray(saved.learned)?saved.learned.map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=SAT_WORD_TOTAL):[];return{learned:[...new Set(cleaned)]}}catch(e){return{learned:[]}}}
function setProgress(progress){const cleaned=[...new Set((progress.learned||[]).map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=SAT_WORD_TOTAL))];try{localStorage.setItem(SAT_PROGRESS_KEY,JSON.stringify({learned:cleaned}))}catch(e){}return{learned:cleaned}}
function learnedSet(){return new Set(getProgress().learned)}
function isLearned(number){return learnedSet().has(Number(number))}
function markLearned(number,learned){const set=learnedSet();learned?set.add(Number(number)):set.delete(Number(number));return setProgress({learned:[...set]})}
function resetAllProgress(){return setProgress({learned:[]})}
function globalCounts(){const learned=learnedSet().size;return{learned,remaining:SAT_WORD_TOTAL-learned,total:SAT_WORD_TOTAL}}
function rangeCounts(start,end){const set=learnedSet();let learned=0;for(let n=start;n<=end;n+=1)if(set.has(n))learned+=1;return{learned,remaining:end-start+1-learned,total:end-start+1}}
function updateProgressBar(detailId,percentId,fillId){const c=globalCounts();const pct=Math.round(c.learned/c.total*100);if(detailId)document.getElementById(detailId).textContent=`${c.learned} of ${c.total} words learned · ${c.remaining} remaining`;if(percentId)document.getElementById(percentId).textContent=`${pct}% complete`;if(fillId)document.getElementById(fillId).style.width=`${pct}%`}

function selectedRange(){const p=new URLSearchParams(location.search);let start=Number(p.get('start'))||1;let end=Number(p.get('end'))||start+24;if(start<1||end>SAT_WORD_TOTAL||end<start){start=1;end=25}return{start,end}}
function rangeWords(){const r=selectedRange();return SAT_VOCABULARY.filter(w=>w.number>=r.start&&w.number<=r.end)}
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let pool=[],questions=[],qIndex=0,score=0,answered=false;const r=selectedRange();document.getElementById('rangeLabel').textContent=`Words ${r.start}–${r.end}`;
function begin(){pool=rangeWords();questions=shuffled(pool).slice(0,Math.min(10,pool.length));qIndex=0;score=0;render()}
function render(){answered=false;const w=questions[qIndex];document.getElementById('questionCount').textContent=`Question ${qIndex+1} of ${questions.length}`;document.getElementById('scoreCount').textContent=`Score: ${score}`;document.getElementById('quizWord').textContent=w.word;document.getElementById('feedback').textContent='';document.getElementById('feedback').className='feedback';document.getElementById('nextQuestion').hidden=true;const distract=shuffled(SAT_VOCABULARY.filter(x=>x.number!==w.number&&x.meaning!==w.meaning)).slice(0,3).map(x=>x.meaning);const options=shuffled([w.meaning,...distract]);const box=document.getElementById('choices');box.innerHTML='';options.forEach(text=>{const b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>answer(b,text===w.meaning,w);box.appendChild(b)})}
function answer(button,correct,w){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===w.meaning)b.classList.add('correct')});const f=document.getElementById('feedback');if(correct){button.classList.add('correct');score++;markLearned(w.number,true);f.textContent='Correct.';f.className='feedback good'}else{button.classList.add('wrong');f.textContent=`Not quite. ${w.word} means: ${w.meaning}`;f.className='feedback bad'}document.getElementById('scoreCount').textContent=`Score: ${score}`;document.getElementById('nextQuestion').textContent=qIndex===questions.length-1?'See Result':'Next Question';document.getElementById('nextQuestion').hidden=false}
document.getElementById('nextQuestion').onclick=()=>{if(qIndex<questions.length-1){qIndex++;render()}else{document.querySelector('.practice-panel').innerHTML=`<h2>Quiz complete</h2><p class="flash-word">${score} / ${questions.length}</p><p>Correct answers were marked learned.</p><button class="btn" onclick="location.reload()">Try Again</button>`}};document.getElementById('restartBtn').onclick=begin;begin();</script><script src="/sat-nav-fix.js?v=20260729-4"></script>

<script id="sat-english-identity-v7">
/* BEGIN SAT ENGLISH IDENTITY V7 */
(() => {
  'use strict';

  if (window.SATEnglishIdentity?.build === '20260804-english-identity-v7-20260804T182532Z') return;

  const normalize = value => {
    const id = String(value || '').trim().toLowerCase();
    return /^[a-z0-9_-]{1,80}$/.test(id) ? id : '';
  };

  const decodeToken = token => {
    try {
      const part = String(token || '').split('.')[1];
      if (!part) return null;
      const base64 = part.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (error) {
      console.warn('Unable to decode the SAT Cognito identity.', error);
      return null;
    }
  };

  const nativeGet = URLSearchParams.prototype.get;
  const tokenClaims = decodeToken(
    sessionStorage.getItem('sat_id_token') ||
    localStorage.getItem('sat_id_token')
  );
  const tokenStudent = normalize(
    window.SATAuth?.studentId ||
    window.SATAuth?.username ||
    tokenClaims?.['cognito:username'] ||
    tokenClaims?.username ||
    tokenClaims?.preferred_username
  );
  const storedStudent = normalize(localStorage.getItem('sat_user'));
  const pageParams = new URLSearchParams(location.search);
  const urlStudent = normalize(nativeGet.call(pageParams, 'student'));
  let studentId = tokenStudent || storedStudent || urlStudent;

  function resolveStudentId() {
    const claims = decodeToken(
      sessionStorage.getItem('sat_id_token') ||
      localStorage.getItem('sat_id_token')
    );
    const authenticated = normalize(
      window.SATAuth?.studentId ||
      window.SATAuth?.username ||
      claims?.['cognito:username'] ||
      claims?.username ||
      claims?.preferred_username
    );
    const stored = normalize(localStorage.getItem('sat_user'));
    studentId = authenticated || stored || studentId || urlStudent;
    if (studentId) localStorage.setItem('sat_user', studentId);
    return studentId;
  }

  if (!URLSearchParams.prototype.__satEnglishIdentityV7) {
    URLSearchParams.prototype.get = function(name) {
      const value = nativeGet.call(this, name);
      if (String(name) === 'student' && !normalize(value)) {
        return resolveStudentId() || value;
      }
      return value;
    };
    Object.defineProperty(URLSearchParams.prototype, '__satEnglishIdentityV7', {
      value: true,
      configurable: true
    });
  }

  function cleanStudentParameter(urlValue) {
    try {
      const url = new URL(urlValue, location.href);
      if (url.origin !== location.origin) return urlValue;
      url.searchParams.delete('student');
      return `${url.pathname}${url.search}${url.hash}`;
    } catch (_) {
      return urlValue;
    }
  }

  function cleanAddressBar() {
    const url = new URL(location.href);
    if (!url.searchParams.has('student')) return;
    url.searchParams.delete('student');
    history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
  }

  function cleanStudentLinks(root = document) {
    root.querySelectorAll?.('a[href]').forEach(anchor => {
      const href = anchor.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
      const cleaned = cleanStudentParameter(href);
      if (cleaned !== href) anchor.setAttribute('href', cleaned);
    });
  }

  resolveStudentId();
  cleanAddressBar();

  window.SATResolveStudentId = resolveStudentId;
  window.SATEnglishIdentity = {
    build: '20260804-english-identity-v7-20260804T182532Z',
    get studentId() { return resolveStudentId(); },
    source: tokenStudent ? 'cognito' : storedStudent ? 'storage' : urlStudent ? 'url' : 'missing',
    normalize,
    resolveStudentId,
    cleanStudentLinks
  };

  const ready = () => {
    cleanStudentLinks();
    setTimeout(cleanStudentLinks, 0);
    setTimeout(cleanStudentLinks, 150);
    setTimeout(cleanStudentLinks, 600);

    if (document.body && window.MutationObserver) {
      const observer = new MutationObserver(records => {
        for (const record of records) {
          record.addedNodes.forEach(node => {
            if (node.nodeType === 1) cleanStudentLinks(node);
          });
        }
      });
      observer.observe(document.body, {childList: true, subtree: true});
      setTimeout(() => observer.disconnect(), 5000);
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ready, {once: true});
  } else {
    ready();
  }
})();
/* END SAT ENGLISH IDENTITY V7 */
</script>


<script id="sat-english-cognito-bootstrap">
(() => {
  'use strict';

  function normalizeStudentId(value) {
    const normalized =
      String(value || '').trim().toLowerCase();

    return /^[a-z0-9_-]{1,80}$/.test(normalized)
      ? normalized
      : '';
  }

  function decodeJwtPayload(token) {
    const parts = String(token || '').split('.');

    if (parts.length !== 3) {
      return null;
    }

    const base64 = parts[1]
      .replace(/-/g, '+')
      .replace(/_/g, '/');

    const padded =
      base64 + '='.repeat((4 - base64.length % 4) % 4);

    try {
      const binary = atob(padded);
      const bytes = Uint8Array.from(
        binary,
        character => character.charCodeAt(0)
      );

      return JSON.parse(
        new TextDecoder().decode(bytes)
      );
    } catch (error) {
      console.warn(
        'Unable to read the SAT Cognito ID token.',
        error
      );

      return null;
    }
  }

  const existing =
    normalizeStudentId(
      window.localStorage.getItem('sat_user')
    );

  if (existing) {
    return;
  }

  const claims =
    decodeJwtPayload(
      window.sessionStorage.getItem('sat_id_token')
    );

  const username =
    normalizeStudentId(
      claims?.['cognito:username'] ||
      claims?.username
    );

  if (username) {
    window.localStorage.setItem(
      'sat_user',
      username
    );
  }
})();
</script>

<script>

const SAT_PROGRESS_KEY = window.SATEnglishCloud.storageKey;

function getProgress() {
  try {
    const raw = localStorage.getItem(SAT_PROGRESS_KEY);
    const saved = raw ? JSON.parse(raw) : {};
    const cleaned = Array.isArray(saved.learned)
      ? saved.learned
          .map(Number)
          .filter((number) => Number.isInteger(number) && number >= 1 && number <= 300)
      : [];
    return { learned: [...new Set(cleaned)] };
  } catch (error) {
    return { learned: [] };
  }
}

function setProgress(progress) {
  const cleaned = [...new Set((progress.learned || [])
    .map(Number)
    .filter((number) => Number.isInteger(number) && number >= 1 && number <= 300))];
  try {
    localStorage.setItem(SAT_PROGRESS_KEY, JSON.stringify({ learned: cleaned }));
    window.SATEnglishCloud.queueLearnedSync(cleaned);
  } catch (error) {
    // The page remains usable if the browser does not allow localStorage.
  }
  return { learned: cleaned };
}

function learnedSet() {
  return new Set(getProgress().learned);
}

function isLearned(number) {
  return learnedSet().has(Number(number));
}

function markLearned(number, learned) {
  const progress = getProgress();
  const set = new Set(progress.learned);
  if (learned) {
    set.add(Number(number));
  } else {
    set.delete(Number(number));
  }
  return setProgress({ learned: [...set] });
}

function resetAllProgress() {
  return setProgress({ learned: [] });
}

function globalCounts() {
  const learned = learnedSet().size;
  return { learned, remaining: 300 - learned };
}

function rangeCounts(start, end) {
  const set = learnedSet();
  let learned = 0;
  for (let number = start; number <= end; number += 1) {
    if (set.has(number)) learned += 1;
  }
  return { learned, remaining: (end - start + 1) - learned, total: end - start + 1 };
}

function askToResetProgress() {
  return window.confirm("Reset all learned-word progress for all 300 SAT words on this browser?");
}

const WORDS = [{"number": 276, "word": "Expend", "spelling": "E, X, P, E, N, D", "meaning": "To spend or use resources such as money, time, or effort.", "synonyms": "spend, use, devote", "example": "The team expended considerable effort preparing for the competition."}, {"number": 277, "word": "Extrapolate", "spelling": "E, X, T, R, A, P, O, L, A, T, E", "meaning": "To estimate or infer something beyond known facts by using existing information.", "synonyms": "infer, project, estimate", "example": "The researchers extrapolated future population growth from current trends."}, {"number": 278, "word": "Frivolous", "spelling": "F, R, I, V, O, L, O, U, S", "meaning": "Not serious or useful; lacking a sensible purpose.", "synonyms": "trivial, silly, unserious", "example": "The judge dismissed the lawsuit as frivolous because it had no valid basis."}, {"number": 279, "word": "Imperative", "spelling": "I, M, P, E, R, A, T, I, V, E", "meaning": "Absolutely necessary or extremely important.", "synonyms": "essential, crucial, urgent", "example": "It is imperative that the team back up the files before updating the system."}, {"number": 280, "word": "Incisive", "spelling": "I, N, C, I, S, I, V, E", "meaning": "Clear, direct, and intelligently analytical.", "synonyms": "sharp, perceptive, penetrating", "example": "The columnist's incisive analysis identified the central problem immediately."}, {"number": 281, "word": "Incongruous", "spelling": "I, N, C, O, N, G, R, U, O, U, S", "meaning": "Not in harmony or not fitting well with the surrounding situation.", "synonyms": "inappropriate, mismatched, out of place", "example": "The modern sculpture looked incongruous in the historic courtroom."}, {"number": 282, "word": "Induce", "spelling": "I, N, D, U, C, E", "meaning": "To cause, bring about, or persuade someone to do something.", "synonyms": "cause, persuade, prompt", "example": "The bright light can induce a headache in some people."}, {"number": 283, "word": "Inhibit", "spelling": "I, N, H, I, B, I, T", "meaning": "To hinder, restrain, or prevent an action or process.", "synonyms": "restrain, hinder, prevent", "example": "Fear of making mistakes can inhibit students from asking questions."}, {"number": 284, "word": "Inordinate", "spelling": "I, N, O, R, D, I, N, A, T, E", "meaning": "Excessive; much more than is reasonable or usual.", "synonyms": "excessive, unreasonable, undue", "example": "The project required an inordinate amount of time for a simple task."}, {"number": 285, "word": "Intuitive", "spelling": "I, N, T, U, I, T, I, V, E", "meaning": "Easy to understand or use without needing detailed instruction; based on instinctive understanding.", "synonyms": "instinctive, natural, easy-to-use", "example": "The app's intuitive design allowed new users to navigate it quickly."}, {"number": 286, "word": "Ironic", "spelling": "I, R, O, N, I, C", "meaning": "Characterized by a result that is opposite of what is expected or intended.", "synonyms": "unexpected, contradictory, paradoxical", "example": "It was ironic that the fire station needed help after a small fire damaged its kitchen."}, {"number": 287, "word": "Judicious", "spelling": "J, U, D, I, C, I, O, U, S", "meaning": "Showing good judgment and careful thought.", "synonyms": "wise, sensible, prudent", "example": "The principal made a judicious decision after hearing from teachers and students."}, {"number": 288, "word": "Legitimate", "spelling": "L, E, G, I, T, I, M, A, T, E", "meaning": "Lawful, valid, or reasonable.", "synonyms": "valid, lawful, genuine", "example": "The committee considered the student's concern legitimate and investigated it."}, {"number": 289, "word": "Marginal", "spelling": "M, A, R, G, I, N, A, L", "meaning": "Small in amount or importance; close to the edge or limit.", "synonyms": "slight, minor, limited", "example": "The new plan produced only marginal improvements in attendance."}, {"number": 290, "word": "Moderate", "spelling": "M, O, D, E, R, A, T, E", "meaning": "Not extreme; reasonable in amount or degree.", "synonyms": "reasonable, mild, balanced", "example": "The region has a moderate climate with neither severe heat nor severe cold."}, {"number": 291, "word": "Nominal", "spelling": "N, O, M, I, N, A, L", "meaning": "Very small compared with the real value or cost; existing mainly in name.", "synonyms": "token, minimal, slight", "example": "The museum charged only a nominal fee to make admission affordable."}, {"number": 292, "word": "Ostensibly", "spelling": "O, S, T, E, N, S, I, B, L, Y", "meaning": "Apparently or supposedly, although the true reason may be different.", "synonyms": "apparently, supposedly, seemingly", "example": "The meeting was ostensibly about budgets, but it became a debate about priorities."}, {"number": 293, "word": "Parity", "spelling": "P, A, R, I, T, Y", "meaning": "Equality or equivalence, especially in status, amount, or value.", "synonyms": "equality, equivalence, balance", "example": "The study examined whether pay parity existed between workers doing similar jobs."}, {"number": 294, "word": "Perfunctory", "spelling": "P, E, R, F, U, N, C, T, O, R, Y", "meaning": "Done with little care, interest, or effort because it is only a routine duty.", "synonyms": "cursory, routine, careless", "example": "He gave the report a perfunctory glance before signing it."}, {"number": 295, "word": "Prevalent", "spelling": "P, R, E, V, A, L, E, N, T", "meaning": "Common or widespread at a particular time or place.", "synonyms": "common, widespread, frequent", "example": "Online learning became prevalent in many schools during the emergency."}, {"number": 296, "word": "Provisional", "spelling": "P, R, O, V, I, S, I, O, N, A, L", "meaning": "Arranged for the present but likely to change later; temporary.", "synonyms": "temporary, tentative, conditional", "example": "The school announced a provisional schedule while repairs were still underway."}, {"number": 297, "word": "Requisite", "spelling": "R, E, Q, U, I, S, I, T, E", "meaning": "Required or necessary for a particular purpose.", "synonyms": "necessary, essential, required", "example": "A signed permission form is a requisite for joining the field trip."}, {"number": 298, "word": "Retain", "spelling": "R, E, T, A, I, N", "meaning": "To keep, continue to have, or remember.", "synonyms": "keep, preserve, maintain", "example": "The museum retained the original photographs in its archive."}, {"number": 299, "word": "Spurious", "spelling": "S, P, U, R, I, O, U, S", "meaning": "False or not genuine, even though it may appear to be true.", "synonyms": "false, counterfeit, misleading", "example": "The editor rejected the article because its main claim was based on spurious evidence."}, {"number": 300, "word": "Synthesize", "spelling": "S, Y, N, T, H, E, S, I, Z, E", "meaning": "To combine separate ideas, information, or parts into a coherent whole.", "synonyms": "combine, integrate, unify", "example": "The student synthesized evidence from several sources to form a strong conclusion."}];
let remainingOnly = true;
let queue = [];
let index = 0;
let score = 0;
let answered = false;
const $ = (id) => document.getElementById(id);

function shuffle(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function buildQueue() {
  const learned = learnedSet();
  queue = shuffle(WORDS.filter((word) => (!remainingOnly || !learned.has(word.number)) && !window.SATEnglishCloud.isLocked("quiz", word.number)).map((word) => word.number));
  index = 0;
  score = 0;
  answered = false;
}
function currentWord() {
  return WORDS.find((word) => word.number === queue[index]);
}
function choicesFor(correct) {
  const otherWords = shuffle(WORDS.filter((word) => word.number !== correct.number)).slice(0, 3);
  return shuffle([correct, ...otherWords]);
}
function updateProgressPanel() {
  const global = globalCounts();
  $("globalLearned").textContent = `${global.learned} / 300 learned`;
  $("globalRemaining").textContent = `${global.remaining} remaining`;
  $("globalFill").style.width = `${(global.learned / 300) * 100}%`;
}
function render() {
  updateProgressPanel();
  if (queue.length === 0 || index >= queue.length) {
    $("quizView").innerHTML = `<div class="card complete"><h1>${remainingOnly ? "No remaining words in this set" : "Quiz complete"}</h1><p>${queue.length === 0 ? "All words in this set are marked learned." : `Score: <b>${score} out of ${queue.length}</b>`}</p><button class="btn primary" id="restart">Study remaining words</button> <button class="btn" id="studyAll">Study all 25 words</button></div>`;
    $("restart").onclick = () => { remainingOnly = true; $("remainingOnly").checked = true; buildQueue(); render(); };
    $("studyAll").onclick = () => { remainingOnly = false; $("remainingOnly").checked = false; buildQueue(); render(); };
    return;
  }
  const word = currentWord();
  $("count").textContent = `Question ${index + 1} of ${queue.length}`;
  $("score").textContent = `Score: ${score}`;
  $("progress").style.width = `${((index + 1) / queue.length) * 100}%`;
  $("word").textContent = word.word;
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("next").disabled = true;
  $("options").innerHTML = "";
  choicesFor(word).forEach((choice) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";
    button.textContent = choice.meaning;
    button.onclick = () => answer(button, choice, word);
    $("options").appendChild(button);
  });
  answered = false;
}
async function answer(button, choice, correct) {
  if (answered) return;
  answered = true;
  const correctAnswer = choice.number === correct.number;
  [...document.querySelectorAll(".option")].forEach((option) => { option.disabled = true; });
  button.classList.add(correctAnswer ? "correct" : "incorrect");
  $("feedback").textContent = "Saving answer…";

  const saved = await window.SATEnglishCloud.recordActivity(
    "quiz",
    correct.number,
    correctAnswer,
    choice.number,
    "English Vocabulary Quiz"
  );

  if (!saved.ok) {
    $("feedback").textContent = saved.code === "QUESTION_LOCKED"
      ? "This question is locked. Ask the administrator to allow a correction."
      : `The answer could not be saved: ${saved.message}`;
    $("feedback").className = "feedback no";
    $("next").disabled = false;
    return;
  }

  if (correctAnswer) {
    score += 1;
    markLearned(correct.number, true);
    $("feedback").textContent = "Correct! This word is now marked learned.";
    $("feedback").className = "feedback ok";
  } else {
    $("feedback").textContent = "Incorrect. The answer is hidden and this question is locked until the administrator allows a correction.";
    $("feedback").className = "feedback no";
  }
  $("score").textContent = `Score: ${score}`;
  $("next").disabled = false;
  updateProgressPanel();
}
$("next").onclick = () => { if (answered) { index += 1; render(); } };
$("remainingOnly").addEventListener("change", (event) => { remainingOnly = event.target.checked; buildQueue(); render(); });
$("resetProgress").addEventListener("click", () => { if (askToResetProgress()) { resetAllProgress(); buildQueue(); render(); } });
window.addEventListener("storage", () => { updateProgressPanel(); });
window.SATEnglishCloud.ready.then(() => { buildQueue(); render(); }).catch(() => {});
</script>

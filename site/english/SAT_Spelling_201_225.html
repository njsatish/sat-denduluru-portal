<script id="sat-english-identity-v7">
/* BEGIN SAT ENGLISH IDENTITY V7 */
(() => {
  'use strict';

  if (window.SATEnglishIdentity?.build === '20260804-english-identity-v7-20260804T182532Z') return;

  const normalize = value => {
    const id = String(value || '').trim().toLowerCase();
    return /^[a-z0-9_-]{1,80}$/.test(id) ? id : '';
  };

  const decodeToken = token => {
    try {
      const part = String(token || '').split('.')[1];
      if (!part) return null;
      const base64 = part.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (error) {
      console.warn('Unable to decode the SAT Cognito identity.', error);
      return null;
    }
  };

  const nativeGet = URLSearchParams.prototype.get;
  const tokenClaims = decodeToken(
    sessionStorage.getItem('sat_id_token') ||
    localStorage.getItem('sat_id_token')
  );
  const tokenStudent = normalize(
    window.SATAuth?.studentId ||
    window.SATAuth?.username ||
    tokenClaims?.['cognito:username'] ||
    tokenClaims?.username ||
    tokenClaims?.preferred_username
  );
  const storedStudent = normalize(localStorage.getItem('sat_user'));
  const pageParams = new URLSearchParams(location.search);
  const urlStudent = normalize(nativeGet.call(pageParams, 'student'));
  let studentId = tokenStudent || storedStudent || urlStudent;

  function resolveStudentId() {
    const claims = decodeToken(
      sessionStorage.getItem('sat_id_token') ||
      localStorage.getItem('sat_id_token')
    );
    const authenticated = normalize(
      window.SATAuth?.studentId ||
      window.SATAuth?.username ||
      claims?.['cognito:username'] ||
      claims?.username ||
      claims?.preferred_username
    );
    const stored = normalize(localStorage.getItem('sat_user'));
    studentId = authenticated || stored || studentId || urlStudent;
    if (studentId) localStorage.setItem('sat_user', studentId);
    return studentId;
  }

  if (!URLSearchParams.prototype.__satEnglishIdentityV7) {
    URLSearchParams.prototype.get = function(name) {
      const value = nativeGet.call(this, name);
      if (String(name) === 'student' && !normalize(value)) {
        return resolveStudentId() || value;
      }
      return value;
    };
    Object.defineProperty(URLSearchParams.prototype, '__satEnglishIdentityV7', {
      value: true,
      configurable: true
    });
  }

  function cleanStudentParameter(urlValue) {
    try {
      const url = new URL(urlValue, location.href);
      if (url.origin !== location.origin) return urlValue;
      url.searchParams.delete('student');
      return `${url.pathname}${url.search}${url.hash}`;
    } catch (_) {
      return urlValue;
    }
  }

  function cleanAddressBar() {
    const url = new URL(location.href);
    if (!url.searchParams.has('student')) return;
    url.searchParams.delete('student');
    history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
  }

  function cleanStudentLinks(root = document) {
    root.querySelectorAll?.('a[href]').forEach(anchor => {
      const href = anchor.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
      const cleaned = cleanStudentParameter(href);
      if (cleaned !== href) anchor.setAttribute('href', cleaned);
    });
  }

  resolveStudentId();
  cleanAddressBar();

  window.SATResolveStudentId = resolveStudentId;
  window.SATEnglishIdentity = {
    build: '20260804-english-identity-v7-20260804T182532Z',
    get studentId() { return resolveStudentId(); },
    source: tokenStudent ? 'cognito' : storedStudent ? 'storage' : urlStudent ? 'url' : 'missing',
    normalize,
    resolveStudentId,
    cleanStudentLinks
  };

  const ready = () => {
    cleanStudentLinks();
    setTimeout(cleanStudentLinks, 0);
    setTimeout(cleanStudentLinks, 150);
    setTimeout(cleanStudentLinks, 600);

    if (document.body && window.MutationObserver) {
      const observer = new MutationObserver(records => {
        for (const record of records) {
          record.addedNodes.forEach(node => {
            if (node.nodeType === 1) cleanStudentLinks(node);
          });
        }
      });
      observer.observe(document.body, {childList: true, subtree: true});
      setTimeout(() => observer.disconnect(), 5000);
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ready, {once: true});
  } else {
    ready();
  }
})();
/* END SAT ENGLISH IDENTITY V7 */
</script>


<script id="sat-english-cognito-bootstrap">
(() => {
  'use strict';

  function normalizeStudentId(value) {
    const normalized =
      String(value || '').trim().toLowerCase();

    return /^[a-z0-9_-]{1,80}$/.test(normalized)
      ? normalized
      : '';
  }

  function decodeJwtPayload(token) {
    const parts = String(token || '').split('.');

    if (parts.length !== 3) {
      return null;
    }

    const base64 = parts[1]
      .replace(/-/g, '+')
      .replace(/_/g, '/');

    const padded =
      base64 + '='.repeat((4 - base64.length % 4) % 4);

    try {
      const binary = atob(padded);
      const bytes = Uint8Array.from(
        binary,
        character => character.charCodeAt(0)
      );

      return JSON.parse(
        new TextDecoder().decode(bytes)
      );
    } catch (error) {
      console.warn(
        'Unable to read the SAT Cognito ID token.',
        error
      );

      return null;
    }
  }

  const existing =
    normalizeStudentId(
      window.localStorage.getItem('sat_user')
    );

  if (existing) {
    return;
  }

  const claims =
    decodeJwtPayload(
      window.sessionStorage.getItem('sat_id_token')
    );

  const username =
    normalizeStudentId(
      claims?.['cognito:username'] ||
      claims?.username
    );

  if (username) {
    window.localStorage.setItem(
      'sat_user',
      username
    );
  }
})();
</script>

<script>

const SAT_PROGRESS_KEY = window.SATEnglishCloud.storageKey;

function getProgress() {
  try {
    const raw = localStorage.getItem(SAT_PROGRESS_KEY);
    const saved = raw ? JSON.parse(raw) : {};
    const cleaned = Array.isArray(saved.learned)
      ? saved.learned
          .map(Number)
          .filter((number) => Number.isInteger(number) && number >= 1 && number <= 300)
      : [];
    return { learned: [...new Set(cleaned)] };
  } catch (error) {
    return { learned: [] };
  }
}

function setProgress(progress) {
  const cleaned = [...new Set((progress.learned || [])
    .map(Number)
    .filter((number) => Number.isInteger(number) && number >= 1 && number <= 300))];
  try {
    localStorage.setItem(SAT_PROGRESS_KEY, JSON.stringify({ learned: cleaned }));
    window.SATEnglishCloud.queueLearnedSync(cleaned);
  } catch (error) {
    // The page remains usable if the browser does not allow localStorage.
  }
  return { learned: cleaned };
}

function learnedSet() {
  return new Set(getProgress().learned);
}

function isLearned(number) {
  return learnedSet().has(Number(number));
}

function markLearned(number, learned) {
  const progress = getProgress();
  const set = new Set(progress.learned);
  if (learned) {
    set.add(Number(number));
  } else {
    set.delete(Number(number));
  }
  return setProgress({ learned: [...set] });
}

function resetAllProgress() {
  return setProgress({ learned: [] });
}

function globalCounts() {
  const learned = learnedSet().size;
  return { learned, remaining: 300 - learned };
}

function rangeCounts(start, end) {
  const set = learnedSet();
  let learned = 0;
  for (let number = start; number <= end; number += 1) {
    if (set.has(number)) learned += 1;
  }
  return { learned, remaining: (end - start + 1) - learned, total: end - start + 1 };
}

function askToResetProgress() {
  return window.confirm("Reset all learned-word progress for all 300 SAT words on this browser?");
}

const WORDS = [{"number": 201, "word": "Prolific", "spelling": "P, R, O, L, I, F, I, C", "meaning": "Producing many works, results, or ideas in a short period of time.", "synonyms": "productive, fruitful, abundant", "example": "The prolific author published three novels and dozens of essays."}, {"number": 202, "word": "Prompt", "spelling": "P, R, O, M, P, T", "meaning": "To cause, bring about, or encourage an action or response.", "synonyms": "cause, provoke, stimulate", "example": "The unexpected result prompted the researchers to repeat the experiment."}, {"number": 203, "word": "Propensity", "spelling": "P, R, O, P, E, N, S, I, T, Y", "meaning": "A natural tendency or inclination toward a particular behavior.", "synonyms": "tendency, inclination, disposition", "example": "Her propensity for careful planning made her an effective project leader."}, {"number": 204, "word": "Prudent", "spelling": "P, R, U, D, E, N, T", "meaning": "Acting with care and good judgment, especially about the future.", "synonyms": "wise, cautious, sensible", "example": "It was prudent to save a copy of the project before making major changes."}, {"number": 205, "word": "Ravenous", "spelling": "R, A, V, E, N, O, U, S", "meaning": "Extremely hungry; showing a very strong desire for something.", "synonyms": "famished, starving, voracious", "example": "After the long practice, the players were ravenous and ate quickly."}, {"number": 206, "word": "Reconcile", "spelling": "R, E, C, O, N, C, I, L, E", "meaning": "To restore friendly relations; to bring two ideas or facts into agreement.", "synonyms": "resolve, harmonize, reunite", "example": "The two friends reconciled after discussing the misunderstanding honestly."}, {"number": 207, "word": "Redundant", "spelling": "R, E, D, U, N, D, A, N, T", "meaning": "Unnecessary because it is repeated or already included.", "synonyms": "repetitive, unnecessary, superfluous", "example": "The editor removed redundant sentences that repeated the same point."}, {"number": 208, "word": "Refute", "spelling": "R, E, F, U, T, E", "meaning": "To prove a statement, argument, or claim to be wrong.", "synonyms": "disprove, contradict, rebut", "example": "The new evidence refuted the rumor that the bridge was unsafe."}, {"number": 209, "word": "Reinforce", "spelling": "R, E, I, N, F, O, R, C, E", "meaning": "To strengthen, support, or make an idea more convincing.", "synonyms": "strengthen, support, bolster", "example": "Several examples reinforced the author's main argument."}, {"number": 210, "word": "Reluctant", "spelling": "R, E, L, U, C, T, A, N, T", "meaning": "Unwilling or hesitant to do something.", "synonyms": "hesitant, unwilling, resistant", "example": "Maya was reluctant to speak because she had not finished her research."}, {"number": 211, "word": "Resilient", "spelling": "R, E, S, I, L, I, E, N, T", "meaning": "Able to recover quickly after difficulties or setbacks.", "synonyms": "adaptable, hardy, strong", "example": "The resilient community rebuilt after the storm damaged several homes."}, {"number": 212, "word": "Revere", "spelling": "R, E, V, E, R, E", "meaning": "To feel deep respect and admiration for someone or something.", "synonyms": "admire, honor, venerate", "example": "Many students revere the teacher who inspired them to pursue science."}, {"number": 213, "word": "Robust", "spelling": "R, O, B, U, S, T", "meaning": "Strong, healthy, and able to perform well under difficult conditions.", "synonyms": "strong, sturdy, vigorous", "example": "The engineers designed a robust system that could handle heavy use."}, {"number": 214, "word": "Sagacious", "spelling": "S, A, G, A, C, I, O, U, S", "meaning": "Showing wise judgment and keen understanding.", "synonyms": "wise, shrewd, discerning", "example": "The sagacious adviser noticed risks that others had overlooked."}, {"number": 215, "word": "Salient", "spelling": "S, A, L, I, E, N, T", "meaning": "Most noticeable, important, or relevant.", "synonyms": "important, prominent, notable", "example": "The report highlighted the salient findings from the survey."}, {"number": 216, "word": "Satiate", "spelling": "S, A, T, I, A, T, E", "meaning": "To satisfy completely, especially a hunger, desire, or need.", "synonyms": "satisfy, fulfill, appease", "example": "The large meal satiated the hungry travelers."}, {"number": 217, "word": "Scrutinize", "spelling": "S, C, R, U, T, I, N, I, Z, E", "meaning": "To examine something very carefully and closely.", "synonyms": "inspect, examine, analyze", "example": "The scientists scrutinized the data before publishing their conclusions."}, {"number": 218, "word": "Serene", "spelling": "S, E, R, E, N, E", "meaning": "Calm, peaceful, and untroubled.", "synonyms": "calm, peaceful, tranquil", "example": "The lake looked serene in the early morning light."}, {"number": 219, "word": "Skeptical", "spelling": "S, K, E, P, T, I, C, A, L", "meaning": "Doubtful; not easily convinced without evidence.", "synonyms": "doubtful, questioning, suspicious", "example": "The audience was skeptical of the advertisement's dramatic claims."}, {"number": 220, "word": "Sparse", "spelling": "S, P, A, R, S, E", "meaning": "Thinly scattered or present in small amounts.", "synonyms": "scant, thin, limited", "example": "Sparse vegetation covered the dry hillside."}, {"number": 221, "word": "Sporadic", "spelling": "S, P, O, R, A, D, I, C", "meaning": "Occurring at irregular intervals; not consistent.", "synonyms": "occasional, irregular, intermittent", "example": "The signal was sporadic, cutting out several times during the call."}, {"number": 222, "word": "Stagnant", "spelling": "S, T, A, G, N, A, N, T", "meaning": "Not moving, changing, or developing; inactive.", "synonyms": "motionless, inactive, stale", "example": "Without fresh water, the pond became stagnant."}, {"number": 223, "word": "Stoic", "spelling": "S, T, O, I, C", "meaning": "Enduring hardship without showing much emotion or complaint.", "synonyms": "unemotional, composed, enduring", "example": "She remained stoic after receiving disappointing news."}, {"number": 224, "word": "Substantial", "spelling": "S, U, B, S, T, A, N, T, I, A, L", "meaning": "Large in amount, size, importance, or value.", "synonyms": "considerable, significant, sizable", "example": "The scholarship provided substantial financial support for tuition."}, {"number": 225, "word": "Succinct", "spelling": "S, U, C, C, I, N, C, T", "meaning": "Brief and clearly expressed.", "synonyms": "concise, brief, compact", "example": "The student gave a succinct summary of the article's main claim."}];
let remainingOnly = true;
let queue = [];
let index = 0;
let score = 0;
let answered = false;
const $ = (id) => document.getElementById(id);
function shuffle(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function clean(value) { return value.trim().toLowerCase().replace(/[^a-z]/g, ""); }
function buildQueue() {
  const learned = learnedSet();
  queue = shuffle(WORDS.filter((word) => (!remainingOnly || !learned.has(word.number)) && !window.SATEnglishCloud.isLocked("spelling", word.number)).map((word) => word.number));
  index = 0; score = 0; answered = false;
}
function currentWord() { return WORDS.find((word) => word.number === queue[index]); }
function updateProgressPanel() {
  const global = globalCounts();
  $("globalLearned").textContent = `${global.learned} / 300 learned`;
  $("globalRemaining").textContent = `${global.remaining} remaining`;
  $("globalFill").style.width = `${(global.learned / 300) * 100}%`;
}
function render() {
  updateProgressPanel();
  if (queue.length === 0 || index >= queue.length) {
    $("spellingView").innerHTML = `<div class="card complete"><h1>${remainingOnly ? "No remaining words in this set" : "Spelling practice complete"}</h1><p>${queue.length === 0 ? "All words in this set are marked learned." : `Correct: <b>${score} out of ${queue.length}</b>`}</p><button class="btn primary" id="restart">Study remaining words</button> <button class="btn" id="studyAll">Study all 25 words</button></div>`;
    $("restart").onclick = () => { remainingOnly = true; $("remainingOnly").checked = true; buildQueue(); render(); };
    $("studyAll").onclick = () => { remainingOnly = false; $("remainingOnly").checked = false; buildQueue(); render(); };
    return;
  }
  const word = currentWord();
  $("count").textContent = `Word ${index + 1} of ${queue.length}`;
  $("score").textContent = `Correct: ${score}`;
  $("progress").style.width = `${((index + 1) / queue.length) * 100}%`;
  $("meaning").textContent = word.meaning;
  $("synonyms").textContent = `Synonyms: ${word.synonyms}`;
  $("example").textContent = `“${word.example}”`;
  $("input").value = "";
  $("input").disabled = false;
  $("input").className = "input";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("check").disabled = false;
  $("next").disabled = true;
  answered = false;
  $("input").focus();
}
async function answer() {
  if (answered) return;
  const word = currentWord();
  const typedAnswer = $("input").value;
  const correct = clean(typedAnswer) === clean(word.word);
  answered = true;
  $("input").disabled = true;
  $("check").disabled = true;
  $("next").disabled = true;
  $("feedback").textContent = "Saving answer…";

  const saved = await window.SATEnglishCloud.recordActivity(
    "spelling",
    word.number,
    correct,
    typedAnswer,
    "English Vocabulary Spelling"
  );

  if (!saved.ok) {
    $("input").classList.add("no");
    $("feedback").textContent = saved.code === "QUESTION_LOCKED"
      ? "This question is locked. Ask the administrator to allow a correction."
      : `The answer could not be saved: ${saved.message}`;
    $("feedback").className = "feedback no";
    $("next").disabled = false;
    return;
  }

  if (correct) {
    score += 1;
    markLearned(word.number, true);
    $("input").classList.add("ok");
    $("feedback").textContent = "Correct! This word is now marked learned.";
    $("feedback").className = "feedback ok";
    $("score").textContent = `Correct: ${score}`;
  } else {
    $("input").classList.add("no");
    $("feedback").textContent = "Incorrect. The correct spelling is hidden and this question is locked until the administrator allows a correction.";
    $("feedback").className = "feedback no";
  }
  $("next").disabled = false;
  updateProgressPanel();
}
function reveal() {
  if (answered) return;
  $("feedback").textContent = "Answer reveal is disabled. Submit an answer or skip this word.";
  $("feedback").className = "feedback no";
}
$("form").addEventListener("submit", (event) => { event.preventDefault(); answer(); });
$("reveal").onclick = reveal;
$("next").onclick = () => { if (answered) { index += 1; render(); } };
$("skip").onclick = () => { index += 1; render(); };
$("remainingOnly").addEventListener("change", (event) => { remainingOnly = event.target.checked; buildQueue(); render(); });
$("resetProgress").addEventListener("click", () => { if (askToResetProgress()) { resetAllProgress(); buildQueue(); render(); } });
window.addEventListener("storage", () => { updateProgressPanel(); });
window.SATEnglishCloud.ready.then(() => { buildQueue(); render(); }).catch(() => {});
</script>

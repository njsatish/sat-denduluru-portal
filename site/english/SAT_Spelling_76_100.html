<script id="sat-english-identity-v7">
/* BEGIN SAT ENGLISH IDENTITY V7 */
(() => {
  'use strict';

  if (window.SATEnglishIdentity?.build === '20260804-english-identity-v7-20260804T182532Z') return;

  const normalize = value => {
    const id = String(value || '').trim().toLowerCase();
    return /^[a-z0-9_-]{1,80}$/.test(id) ? id : '';
  };

  const decodeToken = token => {
    try {
      const part = String(token || '').split('.')[1];
      if (!part) return null;
      const base64 = part.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (error) {
      console.warn('Unable to decode the SAT Cognito identity.', error);
      return null;
    }
  };

  const nativeGet = URLSearchParams.prototype.get;
  const tokenClaims = decodeToken(
    sessionStorage.getItem('sat_id_token') ||
    localStorage.getItem('sat_id_token')
  );
  const tokenStudent = normalize(
    window.SATAuth?.studentId ||
    window.SATAuth?.username ||
    tokenClaims?.['cognito:username'] ||
    tokenClaims?.username ||
    tokenClaims?.preferred_username
  );
  const storedStudent = normalize(localStorage.getItem('sat_user'));
  const pageParams = new URLSearchParams(location.search);
  const urlStudent = normalize(nativeGet.call(pageParams, 'student'));
  let studentId = tokenStudent || storedStudent || urlStudent;

  function resolveStudentId() {
    const claims = decodeToken(
      sessionStorage.getItem('sat_id_token') ||
      localStorage.getItem('sat_id_token')
    );
    const authenticated = normalize(
      window.SATAuth?.studentId ||
      window.SATAuth?.username ||
      claims?.['cognito:username'] ||
      claims?.username ||
      claims?.preferred_username
    );
    const stored = normalize(localStorage.getItem('sat_user'));
    studentId = authenticated || stored || studentId || urlStudent;
    if (studentId) localStorage.setItem('sat_user', studentId);
    return studentId;
  }

  if (!URLSearchParams.prototype.__satEnglishIdentityV7) {
    URLSearchParams.prototype.get = function(name) {
      const value = nativeGet.call(this, name);
      if (String(name) === 'student' && !normalize(value)) {
        return resolveStudentId() || value;
      }
      return value;
    };
    Object.defineProperty(URLSearchParams.prototype, '__satEnglishIdentityV7', {
      value: true,
      configurable: true
    });
  }

  function cleanStudentParameter(urlValue) {
    try {
      const url = new URL(urlValue, location.href);
      if (url.origin !== location.origin) return urlValue;
      url.searchParams.delete('student');
      return `${url.pathname}${url.search}${url.hash}`;
    } catch (_) {
      return urlValue;
    }
  }

  function cleanAddressBar() {
    const url = new URL(location.href);
    if (!url.searchParams.has('student')) return;
    url.searchParams.delete('student');
    history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
  }

  function cleanStudentLinks(root = document) {
    root.querySelectorAll?.('a[href]').forEach(anchor => {
      const href = anchor.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
      const cleaned = cleanStudentParameter(href);
      if (cleaned !== href) anchor.setAttribute('href', cleaned);
    });
  }

  resolveStudentId();
  cleanAddressBar();

  window.SATResolveStudentId = resolveStudentId;
  window.SATEnglishIdentity = {
    build: '20260804-english-identity-v7-20260804T182532Z',
    get studentId() { return resolveStudentId(); },
    source: tokenStudent ? 'cognito' : storedStudent ? 'storage' : urlStudent ? 'url' : 'missing',
    normalize,
    resolveStudentId,
    cleanStudentLinks
  };

  const ready = () => {
    cleanStudentLinks();
    setTimeout(cleanStudentLinks, 0);
    setTimeout(cleanStudentLinks, 150);
    setTimeout(cleanStudentLinks, 600);

    if (document.body && window.MutationObserver) {
      const observer = new MutationObserver(records => {
        for (const record of records) {
          record.addedNodes.forEach(node => {
            if (node.nodeType === 1) cleanStudentLinks(node);
          });
        }
      });
      observer.observe(document.body, {childList: true, subtree: true});
      setTimeout(() => observer.disconnect(), 5000);
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ready, {once: true});
  } else {
    ready();
  }
})();
/* END SAT ENGLISH IDENTITY V7 */
</script>


<script id="sat-english-cognito-bootstrap">
(() => {
  'use strict';

  function normalizeStudentId(value) {
    const normalized =
      String(value || '').trim().toLowerCase();

    return /^[a-z0-9_-]{1,80}$/.test(normalized)
      ? normalized
      : '';
  }

  function decodeJwtPayload(token) {
    const parts = String(token || '').split('.');

    if (parts.length !== 3) {
      return null;
    }

    const base64 = parts[1]
      .replace(/-/g, '+')
      .replace(/_/g, '/');

    const padded =
      base64 + '='.repeat((4 - base64.length % 4) % 4);

    try {
      const binary = atob(padded);
      const bytes = Uint8Array.from(
        binary,
        character => character.charCodeAt(0)
      );

      return JSON.parse(
        new TextDecoder().decode(bytes)
      );
    } catch (error) {
      console.warn(
        'Unable to read the SAT Cognito ID token.',
        error
      );

      return null;
    }
  }

  const existing =
    normalizeStudentId(
      window.localStorage.getItem('sat_user')
    );

  if (existing) {
    return;
  }

  const claims =
    decodeJwtPayload(
      window.sessionStorage.getItem('sat_id_token')
    );

  const username =
    normalizeStudentId(
      claims?.['cognito:username'] ||
      claims?.username
    );

  if (username) {
    window.localStorage.setItem(
      'sat_user',
      username
    );
  }
})();
</script>

<script>

const SAT_PROGRESS_KEY = window.SATEnglishCloud.storageKey;

function getProgress() {
  try {
    const raw = localStorage.getItem(SAT_PROGRESS_KEY);
    const saved = raw ? JSON.parse(raw) : {};
    const cleaned = Array.isArray(saved.learned)
      ? saved.learned
          .map(Number)
          .filter((number) => Number.isInteger(number) && number >= 1 && number <= 300)
      : [];
    return { learned: [...new Set(cleaned)] };
  } catch (error) {
    return { learned: [] };
  }
}

function setProgress(progress) {
  const cleaned = [...new Set((progress.learned || [])
    .map(Number)
    .filter((number) => Number.isInteger(number) && number >= 1 && number <= 300))];
  try {
    localStorage.setItem(SAT_PROGRESS_KEY, JSON.stringify({ learned: cleaned }));
    window.SATEnglishCloud.queueLearnedSync(cleaned);
  } catch (error) {
    // The page remains usable if the browser does not allow localStorage.
  }
  return { learned: cleaned };
}

function learnedSet() {
  return new Set(getProgress().learned);
}

function isLearned(number) {
  return learnedSet().has(Number(number));
}

function markLearned(number, learned) {
  const progress = getProgress();
  const set = new Set(progress.learned);
  if (learned) {
    set.add(Number(number));
  } else {
    set.delete(Number(number));
  }
  return setProgress({ learned: [...set] });
}

function resetAllProgress() {
  return setProgress({ learned: [] });
}

function globalCounts() {
  const learned = learnedSet().size;
  return { learned, remaining: 300 - learned };
}

function rangeCounts(start, end) {
  const set = learnedSet();
  let learned = 0;
  for (let number = start; number <= end; number += 1) {
    if (set.has(number)) learned += 1;
  }
  return { learned, remaining: (end - start + 1) - learned, total: end - start + 1 };
}

function askToResetProgress() {
  return window.confirm("Reset all learned-word progress for all 300 SAT words on this browser?");
}

const WORDS = [{"number": 76, "word": "Exemplary", "spelling": "E, X, E, M, P, L, A, R, Y", "meaning": "Serving as an excellent example; outstanding and worthy of imitation.", "synonyms": "excellent, outstanding, model", "example": "The student's exemplary research paper became a model for next year's class."}, {"number": 77, "word": "Explicit", "spelling": "E, X, P, L, I, C, I, T", "meaning": "Stated clearly and directly, leaving no room for doubt or misunderstanding.", "synonyms": "clear, direct, specific", "example": "The science teacher gave explicit instructions for setting up the experiment."}, {"number": 78, "word": "Exonerate", "spelling": "E, X, O, N, E, R, A, T, E", "meaning": "To clear someone of blame or responsibility for a wrongdoing.", "synonyms": "clear, absolve, vindicate", "example": "The security video helped exonerate the employee who had been accused of taking the package."}, {"number": 79, "word": "Expedite", "spelling": "E, X, P, E, D, I, T, E", "meaning": "To make a process happen more quickly; to speed up.", "synonyms": "accelerate, hasten, speed up", "example": "The clerk expedited the application after receiving all the required documents."}, {"number": 80, "word": "Extol", "spelling": "E, X, T, O, L", "meaning": "To praise enthusiastically and publicly.", "synonyms": "praise, applaud, celebrate", "example": "Critics extolled the film for its careful storytelling and strong performances."}, {"number": 81, "word": "Fallacious", "spelling": "F, A, L, L, A, C, I, O, U, S", "meaning": "Based on mistaken reasoning or a false belief; logically unsound.", "synonyms": "false, misleading, unsound", "example": "The claim that one rainy day disproves climate change is fallacious."}, {"number": 82, "word": "Fastidious", "spelling": "F, A, S, T, I, D, I, O, U, S", "meaning": "Very careful about accuracy, cleanliness, or small details.", "synonyms": "meticulous, precise, careful", "example": "The fastidious editor checked every citation before approving the article."}, {"number": 83, "word": "Feasible", "spelling": "F, E, A, S, I, B, L, E", "meaning": "Possible and practical to do successfully.", "synonyms": "possible, workable, practical", "example": "After reviewing the budget, the committee decided that the plan was feasible."}, {"number": 84, "word": "Fervent", "spelling": "F, E, R, V, E, N, T", "meaning": "Showing strong, sincere, and passionate feeling.", "synonyms": "passionate, ardent, enthusiastic", "example": "The advocate gave a fervent speech in support of the new community center."}, {"number": 85, "word": "Fluctuate", "spelling": "F, L, U, C, T, U, A, T, E", "meaning": "To change frequently or irregularly, especially between higher and lower amounts.", "synonyms": "vary, shift, change", "example": "Fuel prices fluctuate according to changes in supply and demand."}, {"number": 86, "word": "Formidable", "spelling": "F, O, R, M, I, D, A, B, L, E", "meaning": "Difficult to overcome because of strength, size, skill, or complexity.", "synonyms": "intimidating, challenging, daunting", "example": "The team faced a formidable opponent with a strong defense."}, {"number": 87, "word": "Foster", "spelling": "F, O, S, T, E, R", "meaning": "To encourage or help the development of something.", "synonyms": "encourage, promote, nurture", "example": "The teacher used group projects to foster cooperation among students."}, {"number": 88, "word": "Fortuitous", "spelling": "F, O, R, T, U, I, T, O, U, S", "meaning": "Happening by chance, especially in a lucky or helpful way.", "synonyms": "lucky, fortunate, accidental", "example": "A fortuitous meeting with a mentor helped the student find an internship."}, {"number": 89, "word": "Frugal", "spelling": "F, R, U, G, A, L", "meaning": "Careful about spending money or using resources; economical.", "synonyms": "thrifty, economical, sparing", "example": "By cooking at home and avoiding waste, the family maintained a frugal budget."}, {"number": 90, "word": "Galvanize", "spelling": "G, A, L, V, A, N, I, Z, E", "meaning": "To shock or stimulate someone into taking action.", "synonyms": "motivate, spur, stimulate", "example": "The sudden power outage galvanized the neighborhood into organizing an emergency plan."}, {"number": 91, "word": "Garrulous", "spelling": "G, A, R, R, U, L, O, U, S", "meaning": "Excessively talkative, especially about unimportant things.", "synonyms": "talkative, chatty, loquacious", "example": "The garrulous passenger talked throughout the entire flight."}, {"number": 92, "word": "Genuine", "spelling": "G, E, N, U, I, N, E", "meaning": "Real, authentic, or sincerely felt.", "synonyms": "authentic, real, sincere", "example": "Her genuine interest in the students made her an effective teacher."}, {"number": 93, "word": "Hackneyed", "spelling": "H, A, C, K, N, E, Y, E, D", "meaning": "Overused and unoriginal, especially because of being repeated too often.", "synonyms": "trite, cliched, stale", "example": "The reviewer called the movie's ending hackneyed because it relied on a familiar cliche."}, {"number": 94, "word": "Haughty", "spelling": "H, A, U, G, H, T, Y", "meaning": "Arrogantly proud and showing that one feels superior to others.", "synonyms": "arrogant, proud, snobbish", "example": "His haughty manner made it hard for new employees to approach him."}, {"number": 95, "word": "Hypocrisy", "spelling": "H, Y, P, O, C, R, I, S, Y", "meaning": "The practice of claiming to have standards or beliefs that one does not actually follow.", "synonyms": "double standard, insincerity, pretense", "example": "Students pointed out the hypocrisy of a rule against phones when teachers used phones during meetings."}, {"number": 96, "word": "Hypothesis", "spelling": "H, Y, P, O, T, H, E, S, I, S", "meaning": "A proposed explanation or prediction that can be tested through investigation.", "synonyms": "theory, prediction, supposition", "example": "The scientists formed a hypothesis that more sunlight would increase plant growth."}, {"number": 97, "word": "Iconoclast", "spelling": "I, C, O, N, O, C, L, A, S, T", "meaning": "A person who challenges or rejects widely accepted beliefs, traditions, or practices.", "synonyms": "reformer, nonconformist, rebel", "example": "The architect was an iconoclast who rejected traditional building designs."}, {"number": 98, "word": "Imminent", "spelling": "I, M, M, I, N, E, N, T", "meaning": "About to happen very soon.", "synonyms": "impending, approaching, near", "example": "Dark clouds suggested that a thunderstorm was imminent."}, {"number": 99, "word": "Immutable", "spelling": "I, M, M, U, T, A, B, L, E", "meaning": "Unable to be changed; unchanging.", "synonyms": "unchangeable, fixed, permanent", "example": "The author argued that language is not immutable because meanings change over time."}, {"number": 100, "word": "Impartial", "spelling": "I, M, P, A, R, T, I, A, L", "meaning": "Fair and not favoring one person, group, or side over another.", "synonyms": "unbiased, fair, neutral", "example": "A judge must remain impartial while listening to both sides of a case."}];
let remainingOnly = true;
let queue = [];
let index = 0;
let score = 0;
let answered = false;
const $ = (id) => document.getElementById(id);
function shuffle(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function clean(value) { return value.trim().toLowerCase().replace(/[^a-z]/g, ""); }
function buildQueue() {
  const learned = learnedSet();
  queue = shuffle(WORDS.filter((word) => (!remainingOnly || !learned.has(word.number)) && !window.SATEnglishCloud.isLocked("spelling", word.number)).map((word) => word.number));
  index = 0; score = 0; answered = false;
}
function currentWord() { return WORDS.find((word) => word.number === queue[index]); }
function updateProgressPanel() {
  const global = globalCounts();
  $("globalLearned").textContent = `${global.learned} / 300 learned`;
  $("globalRemaining").textContent = `${global.remaining} remaining`;
  $("globalFill").style.width = `${(global.learned / 300) * 100}%`;
}
function render() {
  updateProgressPanel();
  if (queue.length === 0 || index >= queue.length) {
    $("spellingView").innerHTML = `<div class="card complete"><h1>${remainingOnly ? "No remaining words in this set" : "Spelling practice complete"}</h1><p>${queue.length === 0 ? "All words in this set are marked learned." : `Correct: <b>${score} out of ${queue.length}</b>`}</p><button class="btn primary" id="restart">Study remaining words</button> <button class="btn" id="studyAll">Study all 25 words</button></div>`;
    $("restart").onclick = () => { remainingOnly = true; $("remainingOnly").checked = true; buildQueue(); render(); };
    $("studyAll").onclick = () => { remainingOnly = false; $("remainingOnly").checked = false; buildQueue(); render(); };
    return;
  }
  const word = currentWord();
  $("count").textContent = `Word ${index + 1} of ${queue.length}`;
  $("score").textContent = `Correct: ${score}`;
  $("progress").style.width = `${((index + 1) / queue.length) * 100}%`;
  $("meaning").textContent = word.meaning;
  $("synonyms").textContent = `Synonyms: ${word.synonyms}`;
  $("example").textContent = `“${word.example}”`;
  $("input").value = "";
  $("input").disabled = false;
  $("input").className = "input";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("check").disabled = false;
  $("next").disabled = true;
  answered = false;
  $("input").focus();
}
async function answer() {
  if (answered) return;
  const word = currentWord();
  const typedAnswer = $("input").value;
  const correct = clean(typedAnswer) === clean(word.word);
  answered = true;
  $("input").disabled = true;
  $("check").disabled = true;
  $("next").disabled = true;
  $("feedback").textContent = "Saving answer…";

  const saved = await window.SATEnglishCloud.recordActivity(
    "spelling",
    word.number,
    correct,
    typedAnswer,
    "English Vocabulary Spelling"
  );

  if (!saved.ok) {
    $("input").classList.add("no");
    $("feedback").textContent = saved.code === "QUESTION_LOCKED"
      ? "This question is locked. Ask the administrator to allow a correction."
      : `The answer could not be saved: ${saved.message}`;
    $("feedback").className = "feedback no";
    $("next").disabled = false;
    return;
  }

  if (correct) {
    score += 1;
    markLearned(word.number, true);
    $("input").classList.add("ok");
    $("feedback").textContent = "Correct! This word is now marked learned.";
    $("feedback").className = "feedback ok";
    $("score").textContent = `Correct: ${score}`;
  } else {
    $("input").classList.add("no");
    $("feedback").textContent = "Incorrect. The correct spelling is hidden and this question is locked until the administrator allows a correction.";
    $("feedback").className = "feedback no";
  }
  $("next").disabled = false;
  updateProgressPanel();
}
function reveal() {
  if (answered) return;
  $("feedback").textContent = "Answer reveal is disabled. Submit an answer or skip this word.";
  $("feedback").className = "feedback no";
}
$("form").addEventListener("submit", (event) => { event.preventDefault(); answer(); });
$("reveal").onclick = reveal;
$("next").onclick = () => { if (answered) { index += 1; render(); } };
$("skip").onclick = () => { index += 1; render(); };
$("remainingOnly").addEventListener("change", (event) => { remainingOnly = event.target.checked; buildQueue(); render(); });
$("resetProgress").addEventListener("click", () => { if (askToResetProgress()) { resetAllProgress(); buildQueue(); render(); } });
window.addEventListener("storage", () => { updateProgressPanel(); });
window.SATEnglishCloud.ready.then(() => { buildQueue(); render(); }).catch(() => {});
</script>

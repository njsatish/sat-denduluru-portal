<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAT Student Login</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #263247, #10141d 55%);
      color: #f7f9fc;
      padding: 24px;
    }
    main {
      width: min(440px, 100%);
      padding: 36px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      background: rgba(18,24,35,.94);
      box-shadow: 0 22px 60px rgba(0,0,0,.35);
    }
    .eyebrow { margin: 0 0 8px; color: #a9b7cc; font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { color: #c8d0dc; line-height: 1.55; }
    button, a.button {
      width: 100%;
      min-height: 48px;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 12px;
      background: #f4f7fb;
      color: #111722;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 24px; margin-top: 16px; color: #ffd68a; }
    .secondary { background: transparent !important; color: #dbe5f4 !important; border: 1px solid rgba(255,255,255,.18) !important; }
  </style>
  <script src="/js/auth-config.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">SAT Denduluru</p>
    <h1>Student login</h1>
    <p>Sign in with your student username and password. New students will be asked to replace their temporary password.</p>
    <button id="loginButton" type="button">Sign in</button>
    <div id="signedInActions" hidden>
      <a class="button" href="/math/index.html">Continue to SAT Math</a>
      <button class="secondary" id="logoutButton" type="button">Sign out</button>
    </div>
    <p id="message" role="status"></p>
  </main>

  <script>
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const signedInActions = document.getElementById("signedInActions");
    const message = document.getElementById("message");

    SATAuth.getSession().then((session) => {
      if (session) {
        loginButton.hidden = true;
        signedInActions.hidden = false;
        const username = session.claims && (session.claims.name || session.claims["cognito:username"]);
        message.textContent = username ? `Signed in as ${username}.` : "You are signed in.";
      }
    });

    loginButton.addEventListener("click", async () => {
      loginButton.disabled = true;
      message.textContent = "Opening secure login…";
      const requestedPath = new URLSearchParams(window.location.search).get("returnTo");
      try {
        await SATAuth.startLogin(requestedPath || "/math/index.html");
      } catch (error) {
        loginButton.disabled = false;
        message.textContent = error.message;
      }
    });

    logoutButton.addEventListener("click", SATAuth.logout);
  </script>
</body>
</html>
